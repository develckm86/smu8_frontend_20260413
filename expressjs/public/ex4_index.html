<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>REST API</title>
</head>
<body>
  <h1>REST API</h1>
  <h2>url 에 파라미터 추가 params</h2>
  <p>패스변수는 무조건 존재해야하는 파라미터, 쿼리스트링 존재하지 않을 수도 있는 파라미터</p>
  <ul>
    <li><a href="/user?id=123">/user?id=123 : 쿼리스트링</a></li>
    <li><a href="/123/user">/123/user : 패스변수</a></li>
    <li><a href=".//user">.//user : 패스변수가 없을때=404</a></li>
    <li><a href="/일이삼/user">/일이삼/user : 패스변수가 형식을 잘못했을때</a></li>
    <li><a href="/user/123">/user/123 : 패스변수</a></li>
    <li><a href="/user/123?page=1">/user/123?page=1 : 패스변수+쿼스트링</a></li>
  </ul>
  <hr>
  <h2>동기식 통신의 post</h2>
  <form action="./user" method="post" name="userForm">
    id:<input name="id" value="7777" placeholder="id"><br>
    name:<input name="name" value="smu8" placeholder="이름"><br>
    <button>제출</button>
  </form>
  <hr>
  <button type="button" id="putBtn">유정수정(put)</button>
  <script>
    const userForm=document.forms["userForm"];
    console.log(userForm);
    const data=new FormData(userForm);
    console.log(data)
    console.log(new URLSearchParams(data))
    console.log(new URLSearchParams(data).toString())


    const userPut=async ()=>{
      const res=await fetch("/user",{
        method:"PUT",
        headers:{
          "Content-Type":"application/x-www-form-urlencoded"
        },
        //body:"id=333&name=경민코딩"
        body:new URLSearchParams(new FormData(userForm))
      })
    }
    putBtn.addEventListener("click",userPut);

  </script>
  <hr>
  <button id="deleteBtn">user 삭제 delete</button>

  <script>
    console.log(Object.fromEntries(new FormData(userForm)))
    const userDelete=async ()=>{
      const paramObj={id:999};
      const res=await fetch("/user",{
        method :"DELETE",
        headers : {
          "Content-Type":"application/json"
        },
        //body : JSON.stringify(paramObj)
        body : JSON.stringify(
                Object.fromEntries(new FormData(userForm))
                )
      });
    };
    deleteBtn.addEventListener("click",userDelete);
  </script>

</body>
</html>
