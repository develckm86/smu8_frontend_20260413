<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>expressjs 서버</title>
</head>
<body>
    <h1>expressjs 서버</h1>
    <h2>/users 동적리소스 라우팅 호출</h2>
    <p><a href="/users">유저 리스트 조회</a></p>
    <hr>
    <h2>a*b*c= /multi?a=10&b=20&c=30</h2>

    <hr>
    <h2>err 처리 미들웨어, 404 미들웨어</h2>
    <p><a href="/err">강제로 에러발생</a></p>
    <p><a href="/aaaa">존재하지 않는 페이지호출</a></p>
    <h2>Post 데이터 처리</h2>

        <p><label>유저이름
            <input name="userName" value="경민코딩">
        </label></p>
        <p><label>비밀번호
            <input name="userPw" value="1234" type="password">
        </label></p>
        <button>제출</button>
    </form>
